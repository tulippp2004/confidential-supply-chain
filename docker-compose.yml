version: '3.8'

# Midnight local devnet stack for confidential-supply-chain
# Requires Docker Desktop with WSL integration enabled.
# Start with: npm run proof-server:start
# Stop with:  npm run proof-server:stop

services:
  # ── Proof Server ─────────────────────────────────────────────────────────────
  proof-server:
    image: ghcr.io/midnight-ntwrk/proof-server:latest
    container_name: supply-chain-proof-server
    ports:
      - "6300:6300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Midnight Node ─────────────────────────────────────────────────────────────
  node:
    image: ghcr.io/midnight-ntwrk/midnight-node:latest
    container_name: supply-chain-node
    ports:
      - "9944:9944"
      - "9933:9933"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9933/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    depends_on:
      proof-server:
        condition: service_healthy

  # ── Indexer ───────────────────────────────────────────────────────────────────
  indexer:
    image: ghcr.io/midnight-ntwrk/indexer:latest
    container_name: supply-chain-indexer
    ports:
      - "8088:8088"
    environment:
      - NODE_URL=ws://node:9944
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/v4/graphql"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
