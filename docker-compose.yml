# Midnight local devnet stack for confidential-supply-chain
# Requires Docker Desktop with WSL integration enabled.
# Start with: npm run proof-server:start
# Stop with:  npm run proof-server:stop

services:
  # ── Proof Server ─────────────────────────────────────────────────────────────
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: supply-chain-proof-server
    ports:
      - "6300:6300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Midnight Node ─────────────────────────────────────────────────────────────
  node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: supply-chain-node
    ports:
      - "9944:9944"
      - "9933:9933"
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      proof-server:
        condition: service_healthy

  # ── Indexer ───────────────────────────────────────────────────────────────────
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: supply-chain-indexer
    ports:
      - "8088:8088"
    environment:
      - NODE_URL=ws://node:9944
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - node
