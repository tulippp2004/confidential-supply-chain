name: CI — Confidential Supply Chain Compliance Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Compile Contract · Test · Build Frontend
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js 22 via nvm ──────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Install Compact compiler ────────────────────────────────────────────
      - name: Install Compact compiler
        run: |
          curl -fsSL https://midnight.network/install-compact.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ── Backend Dependencies ────────────────────────────────────────────────
      - name: Install root dependencies
        run: npm ci || npm install

      # ── Compile Contract ────────────────────────────────────────────────────
      - name: Compile Compact contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v compact &> /dev/null; then
            compact compile contracts/supply-chain.compact contracts/managed/supply-chain
            echo "✅ Contract compiled successfully"
          else
            echo "⚠ compact installation check"
            PATH="$HOME/.local/bin:$PATH" compact compile contracts/supply-chain.compact contracts/managed/supply-chain || true
          fi

      # ── Run Tests ───────────────────────────────────────────────────────────
      - name: Run test suite
        run: npm test

      # ── Frontend Dependencies ───────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      # ── Build Frontend (Next.js) ────────────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_NETWORK: preview
          NEXT_PUBLIC_CONTRACT_ADDRESS: '0x8f2d6c1b4a3e567890abcdef1234567890abcdef1234567890abcdef12345678'
          NEXT_PUBLIC_PROOF_SERVER_URL: http://127.0.0.1:6300
        run: npm run build

      # ── Upload Next.js Artifact ─────────────────────────────────────────────
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next/
          retention-days: 7
